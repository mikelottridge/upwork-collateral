name: Materialize finance MP3 narration

on:
  push:
    branches:
      - fix/use-recorded-mp3-narration
    paths:
      - '.audio-payload/trigger'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/use-recorded-mp3-narration
          fetch-depth: 0

      - name: Reconstruct exact update package
        shell: bash
        run: |
          set -euo pipefail
          cat .audio-payload/package.b64.part-* | tr -d '\r\n' | base64 --decode > /tmp/finance-mp3-update.zip
          test "$(wc -c < /tmp/finance-mp3-update.zip)" -gt 600000
          unzip -t /tmp/finance-mp3-update.zip
          rm -rf /tmp/finance-mp3-update
          mkdir -p /tmp/finance-mp3-update
          unzip -q /tmp/finance-mp3-update.zip -d /tmp/finance-mp3-update
          root=/tmp/finance-mp3-update/financial-metrics-pipeline-mp3-update
          test -f "$root/financial-metrics-pipeline/audio/slide-01.mp3"
          test -f "$root/financial-metrics-pipeline/audio/slide-07.mp3"
          mkdir -p financial-metrics-pipeline/audio financial-metrics-pipeline/site
          cp "$root"/financial-metrics-pipeline/audio/slide-*.mp3 financial-metrics-pipeline/audio/
          cp "$root/financial-metrics-pipeline/site/case-study-data.js" financial-metrics-pipeline/site/case-study-data.js
          cp "$root/financial-metrics-pipeline/site/index.html" financial-metrics-pipeline/site/index.html
          rm -f financial-metrics-pipeline/site/narration-tts.js
          rm -f financial-metrics-pipeline/audio/test-local-path.txt
          rm -rf .audio-payload
          rm -f .github/workflows/test-drive-audio-download.yml
          rm -f .github/workflows/materialize-finance-mp3.yml
          for f in financial-metrics-pipeline/audio/slide-*.mp3; do
            test "$(wc -c < "$f")" -gt 80000
            file "$f" | grep -Eqi 'audio|mpeg'
          done
          ! grep -R 'tts:' financial-metrics-pipeline/site
          ! grep -R 'narration-tts' financial-metrics-pipeline/site/index.html
          grep -q '../audio/slide-01.mp3' financial-metrics-pipeline/site/case-study-data.js
          grep -q '../audio/slide-07.mp3' financial-metrics-pipeline/site/case-study-data.js

      - name: Commit recorded narration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use recorded MP3 narration for finance presentation'
          git push origin HEAD:fix/use-recorded-mp3-narration
