<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1040" viewBox="0 0 780 1040" role="img" aria-labelledby="title desc">
  <title id="title">Secure Google Sheets AI reporting path</title>
  <desc id="desc">Selected Google Sheet facts pass through bound Apps Script to an explicit Gemini, Claude, or OpenAI provider and an owner-private Google Doc.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2d29"/><stop offset="1" stop-color="#102746"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2fa38f"/><stop offset="1" stop-color="#d8a936"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter>
  </defs>
  <rect width="780" height="1040" rx="42" fill="url(#bg)"/>
  <rect x="42" y="42" width="696" height="8" rx="4" fill="url(#accent)"/>
  <text x="54" y="100" fill="#66ccb9" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">SECURE REPORTING PATH</text>
  <text x="54" y="154" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="700">One workflow. Three explicit</text>
  <text x="54" y="200" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="700">provider choices.</text>
  <text x="54" y="238" fill="#b8c8d4" font-family="Arial, sans-serif" font-size="20">No secret value appears in the Sheet, dialog, log, or report.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="282" width="672" height="132" rx="22" fill="#fff"/>
    <circle cx="102" cy="328" r="25" fill="#e3f4ef"/><text x="102" y="336" text-anchor="middle" fill="#167665" font-family="Arial" font-size="22" font-weight="700">1</text>
    <text x="146" y="325" fill="#11263d" font-family="Arial" font-size="26" font-weight="700">Selected Google Sheet facts</text>
    <text x="146" y="358" fill="#536170" font-family="Arial" font-size="18">One project · task IDs · deterministic KPIs</text>
    <text x="146" y="386" fill="#536170" font-family="Arial" font-size="18">Notes and email addresses excluded</text>
  </g>
  <path d="M390 414v28" stroke="#5dc7b3" stroke-width="5" stroke-linecap="round"/><path d="m377 438 13 14 13-14" fill="none" stroke="#5dc7b3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="54" y="458" width="672" height="132" rx="22" fill="#fff"/>
    <circle cx="102" cy="504" r="25" fill="#e3f4ef"/><text x="102" y="512" text-anchor="middle" fill="#167665" font-family="Arial" font-size="22" font-weight="700">2</text>
    <text x="146" y="501" fill="#11263d" font-family="Arial" font-size="26" font-weight="700">Bound Google Apps Script</text>
    <text x="146" y="534" fill="#536170" font-family="Arial" font-size="18">Validates request · caps inputs · computes facts</text>
    <text x="146" y="562" fill="#536170" font-family="Arial" font-size="18">Document lock prevents overlapping writes</text>
  </g>
  <path d="M390 590v28" stroke="#5dc7b3" stroke-width="5" stroke-linecap="round"/><path d="m377 614 13 14 13-14" fill="none" stroke="#5dc7b3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="54" y="634" width="672" height="148" rx="22" fill="#fff"/>
    <circle cx="102" cy="680" r="25" fill="#fff2d2"/><text x="102" y="688" text-anchor="middle" fill="#8b6310" font-family="Arial" font-size="22" font-weight="700">3</text>
    <text x="146" y="677" fill="#11263d" font-family="Arial" font-size="26" font-weight="700">Explicit provider selection</text>
    <text x="146" y="710" fill="#536170" font-family="Arial" font-size="18">Gemini → owner Google authorization</text>
    <text x="146" y="738" fill="#536170" font-family="Arial" font-size="18">Claude / OpenAI → separate Secret Manager secrets</text>
    <text x="146" y="766" fill="#536170" font-family="Arial" font-size="18">No automatic provider switching</text>
  </g>
  <path d="M390 782v28" stroke="#5dc7b3" stroke-width="5" stroke-linecap="round"/><path d="m377 806 13 14 13-14" fill="none" stroke="#5dc7b3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="54" y="826" width="672" height="132" rx="22" fill="#fff"/>
    <circle cx="102" cy="872" r="25" fill="#e3f4ef"/><text x="102" y="880" text-anchor="middle" fill="#167665" font-family="Arial" font-size="22" font-weight="700">4</text>
    <text x="146" y="869" fill="#11263d" font-family="Arial" font-size="26" font-weight="700">Owner-private Google Doc</text>
    <text x="146" y="902" fill="#536170" font-family="Arial" font-size="18">Validated task references · review-before-sharing label</text>
    <text x="146" y="930" fill="#536170" font-family="Arial" font-size="18">shared=false verified · owner permission only</text>
  </g>
  <text x="390" y="1000" text-anchor="middle" fill="#d7e4ea" font-family="Arial" font-size="18" font-weight="700">PUBLIC-SAFE ARCHITECTURE PROOF · NO KEYS OR PRIVATE IDS SHOWN</text>
</svg>